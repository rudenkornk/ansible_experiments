---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Check if authorized_keys already exist for current user
      ansible.builtin.stat:
        path: /home/{{ ansible_user }}/.ssh/authorized_keys
      register: authorized_keys_res

    - name: Register authorized keys for root
      ansible.builtin.copy:
        src: /home/{{ ansible_user }}/.ssh/authorized_keys
        dest: /root/.ssh/authorized_keys
        remote_src: true
        owner: root
        group: root
        mode: 0o644
      become: true
      when: ansible_user is defined and authorized_keys_res.stat.exists

    - name: Delete python3 package
      ansible.builtin.package:
        name:
          - python3
          - python3.6
          - python3.7
          - python3.8
          - python3.9
          - python3.10
          - python3.11
          - python3.12
          - python3.13
          - python3.14
          - python3.15
          - python3-minimal
        state: absent
      become: true
