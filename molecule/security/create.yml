---
- name: Create
  hosts: localhost
  gather_facts: false
  vars:
    molecule_docker_image: geerlingguy/docker-ubuntu2404-ansible:latest
    molecule_container_name: docker-security-test
  tasks:
    - name: Create docker container
      community.docker.docker_container:
        name: "{{ molecule_container_name }}"
        image: "{{ molecule_docker_image }}"
        state: started
        command: ""
        privileged: true
        cgroupns_mode: host
        volumes:
          - /sys/fs/cgroup:/sys/fs/cgroup:rw
        # Important: this makes the container available to Molecule.
        networks:
          - name: bridge
      register: server

    - name: Fail if container is not running
      when: not server.container.State.Running
      ansible.builtin.fail:
        msg: "Container {{ molecule_container_name }} is not running."
