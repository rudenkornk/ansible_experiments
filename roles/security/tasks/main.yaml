- name: Ensure SSH key is used for the connection
  ansible.builtin.assert:
    that:
      - ansible_password is not defined
    fail_msg: |
      "Refusing to disable password authentication on host, which uses password to connect. "
      "Please setup authentication with SSH key first!"
    success_msg: "Connection verified using SSH key."

- name: Disable password authentication
  become: true
  ansible.builtin.lineinfile:
    path: "/etc/ssh/sshd_config"
    regexp: '[ #]{0,10}PasswordAuthentication \w*\s*$'
    line: PasswordAuthentication no
  register: ssh_config_1

- name: Disable keyboard interactive authentication
  become: true
  ansible.builtin.lineinfile:
    path: "/etc/ssh/sshd_config"
    regexp: '[ #]{0,10}KbdInteractiveAuthentication \w*\s*$'
    line: KbdInteractiveAuthentication no
  register: ssh_config_2

- name: Disable challenge response authentication
  become: true
  ansible.builtin.lineinfile:
    path: "/etc/ssh/sshd_config"
    regexp: '[ #]{0,10}ChallengeResponseAuthentication \w*\s*$'
    line: ChallengeResponseAuthentication no
  register: ssh_config_3

- name: Disable UsePAM
  become: true
  ansible.builtin.lineinfile:
    path: "/etc/ssh/sshd_config"
    regexp: '[ #]{0,10}UsePAM \w*\s*$'
    line: UsePAM no
  register: ssh_config_4

- name: Restart sshd
  become: true
  ansible.builtin.service:
    name: sshd
    state: restarted
  when: (
    ssh_config_1.changed or
    ssh_config_2.changed or
    ssh_config_3.changed or
    ssh_config_4.changed or
    false
    )
